[project]
name = "ocelescope-module-alignments"
version = "0.1.0"
readme = "README.md"
description = "case-centric Alignments"
authors = [{ name = "Uy Sa Huynh" }]
requires-python = ">=3.11"
dependencies = [
  "ocelescope-backend>=0.10.1",
  "ocelescope-module-filter>=0.10.1,<0.11.0",
  "ocelescope-module-ocel>=0.10.1,<0.11.0",
]

[project.entry-points."ocelescope_backend.modules"]
caseCentricAlignments = "ocelescope_module_alignments.module:Alignments"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
